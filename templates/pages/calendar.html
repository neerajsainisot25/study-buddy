<div id="calendarPage" class="page-content">
    <!-- Page Header -->
    <div class="section-card" style="background: var(--dark); color: var(--primary); border: 2px solid var(--primary);">
        <div class="flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-bold" style="color: var(--primary);">📅 Schedule</h2>
                <p class="text-sm mt-1" style="color: var(--light);">Manage your events and deadlines</p>
            </div>
            <div class="flex gap-2">
                <button onclick="previousMonth()" class="px-4 py-2 rounded-lg transition-colors font-medium" style="background: var(--primary); color: var(--dark);">
                    ← Prev
                </button>
                <button onclick="goToToday()" class="px-4 py-2 rounded-lg transition-colors font-medium" style="background: var(--accent); color: white;">
                    Today
                </button>
                <button onclick="nextMonth()" class="px-4 py-2 rounded-lg transition-colors font-medium" style="background: var(--primary); color: var(--dark);">
                    Next →
                </button>
            </div>
        </div>
        <div class="mt-4 text-center">
            <span id="currentMonthYear" class="text-xl font-bold" style="color: var(--primary);"></span>
        </div>
    </div>

    <!-- Main Layout: Calendar + Daily Events -->
    <div style="display: grid; grid-template-columns: 1fr 350px; gap: 24px;">
        <!-- Left Column: Calendar -->
        <div class="space-y-6">
            <!-- Calendar Grid -->
            <div class="section-card">
                <div class="bg-white rounded-lg border overflow-hidden" style="border-color: var(--border);">
                    <!-- Day Headers -->
                    <div class="grid grid-cols-7 border-b" style="background: var(--dark); border-color: var(--border);">
                        <div class="px-2 py-3 text-center text-sm font-semibold" style="color: var(--primary);">Sun</div>
                        <div class="px-2 py-3 text-center text-sm font-semibold" style="color: var(--primary);">Mon</div>
                        <div class="px-2 py-3 text-center text-sm font-semibold" style="color: var(--primary);">Tue</div>
                        <div class="px-2 py-3 text-center text-sm font-semibold" style="color: var(--primary);">Wed</div>
                        <div class="px-2 py-3 text-center text-sm font-semibold" style="color: var(--primary);">Thu</div>
                        <div class="px-2 py-3 text-center text-sm font-semibold" style="color: var(--primary);">Fri</div>
                        <div class="px-2 py-3 text-center text-sm font-semibold" style="color: var(--primary);">Sat</div>
                    </div>
                    <div id="calendarGrid" class="grid grid-cols-7">
                        <!-- Calendar days will be inserted here -->
                    </div>
                </div>
            </div>

            <!-- Add Event Form -->
            <div class="section-card">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold" style="color: var(--text);">➕ Add Event</h3>
                    <button onclick="suggestEvent()" class="px-4 py-2 rounded-lg transition-colors text-sm font-medium" style="background: var(--accent); color: white;">
                        ✨ AI Suggest
                    </button>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-2" style="color: var(--text);">Event Title</label>
                        <input type="text" id="eventTitle" placeholder="e.g., Math Quiz, Study Session" 
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2" 
                            style="border-color: var(--border); background: var(--bg-secondary);" />
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium mb-2" style="color: var(--text);">Description</label>
                        <textarea id="eventDescription" placeholder="Event details..." rows="2"
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2"
                            style="border-color: var(--border); background: var(--bg-secondary);"></textarea>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-2" style="color: var(--text);">Date</label>
                            <input type="date" id="eventDate" 
                                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2"
                                style="border-color: var(--border); background: var(--bg-secondary);" />
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2" style="color: var(--text);">Time</label>
                            <input type="time" id="eventTime" 
                                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2"
                                style="border-color: var(--border); background: var(--bg-secondary);" />
                        </div>
                    </div>
                    
                    <button onclick="addEvent()" 
                        class="w-full px-6 py-3 rounded-lg transition-colors font-medium"
                        style="background: var(--primary); color: var(--text-on-primary);">
                        Add Event
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Column: Daily Events -->
        <div class="space-y-6">
            <!-- Today's Events -->
            <div class="section-card" style="position: sticky; top: 20px;">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold" style="color: var(--text);">📋 Today's Events</h3>
                    <span id="todayDate" class="text-sm font-medium px-3 py-1 rounded-full" style="background: var(--primary); color: var(--dark);"></span>
                </div>
                <div id="todayEventsList" class="space-y-3 max-h-[400px] overflow-y-auto">
                    <div class="text-center text-gray-500 py-8 text-sm">No events today</div>
                </div>
            </div>

            <!-- Upcoming Events -->
            <div class="section-card">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold" style="color: var(--text);">🔜 Upcoming</h3>
                    <span id="upcomingCount" class="text-xs font-semibold px-2 py-1 rounded-full" style="background: var(--accent); color: white;">0</span>
                </div>
                <div id="eventsList" class="space-y-3 max-h-[300px] overflow-y-auto">
                    <div class="text-center text-gray-500 py-8 text-sm">No upcoming events</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Mobile: Stack layout -->
    <style>
        @media (max-width: 1024px) {
            #calendarPage > div:nth-child(2) {
                grid-template-columns: 1fr !important;
            }
        }
    </style>
</div>
