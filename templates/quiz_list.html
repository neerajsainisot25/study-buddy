{% extends "base.html" %}

{% block title %}Quizzes - {{ config.APP_NAME }}{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 p-6">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900">My Quizzes</h1>
            <button 
                onclick="showGenerateForm()"
                class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                + Generate Quiz
            </button>
        </div>

        <!-- Generate Quiz Form (hidden by default) -->
        <div id="generate-form" class="hidden bg-white p-6 rounded-lg shadow mb-6">
            <h2 class="text-xl font-semibold mb-4">Generate New Quiz</h2>
            <form id="quiz-generate-form" onsubmit="generateQuiz(event)">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Topic</label>
                    <input 
                        type="text" 
                        name="topic" 
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="e.g., Python programming, World History">
                </div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Number of Questions</label>
                        <input 
                            type="number" 
                            name="num_questions" 
                            min="1" 
                            max="20" 
                            value="5"
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Difficulty</label>
                        <select 
                            name="difficulty"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="beginner">Beginner</option>
                            <option value="intermediate" selected>Intermediate</option>
                            <option value="advanced">Advanced</option>
                        </select>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button 
                        type="submit"
                        class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                        Generate
                    </button>
                    <button 
                        type="button"
                        onclick="hideGenerateForm()"
                        class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-300 transition-colors">
                        Cancel
                    </button>
                </div>
            </form>
        </div>

        <!-- Quiz List -->
        <div class="mb-8">
            <h2 class="text-xl font-semibold mb-4">My Quizzes</h2>
            <div id="quiz-list" class="space-y-3" hx-get="/quiz" hx-trigger="load, every 5s" hx-swap="innerHTML">
                <!-- Quizzes will be loaded here via HTMX -->
            </div>
        </div>

        <!-- Quiz History -->
        <div class="mt-8">
            <h2 class="text-xl font-semibold mb-4">Quiz History</h2>
            <div id="quiz-history" class="space-y-3" hx-get="/quiz/history" hx-trigger="load, every 5s" hx-swap="innerHTML">
                <!-- History will be loaded here via HTMX -->
            </div>
        </div>
    </div>
</div>

<script>
function getUserId() {
    return localStorage.getItem('userId') || '00000000-0000-0000-0000-000000000000';
}

// Set up HTMX to add X-User-Id header
document.body.addEventListener('htmx:configRequest', function(event) {
    event.detail.headers['X-User-Id'] = getUserId();
});

function showGenerateForm() {
    document.getElementById('generate-form').classList.remove('hidden');
}

function hideGenerateForm() {
    document.getElementById('generate-form').classList.add('hidden');
}

async function generateQuiz(event) {
    event.preventDefault();
    const form = event.target;
    const formData = new FormData(form);
    
    const data = {
        topic: formData.get('topic'),
        num_questions: parseInt(formData.get('num_questions')),
        difficulty: formData.get('difficulty'),
        quiz_type: 'multiple_choice',
        source_material: 'general'
    };
    
    try {
        const response = await fetch('/quiz/generate', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-User-Id': getUserId()
            },
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        if (response.ok) {
            // Reload quiz list
            htmx.trigger('#quiz-list', 'htmx:refresh');
            hideGenerateForm();
            form.reset();
            // Redirect to play page
            window.location.href = `/quiz/${result.id}/play`;
        } else {
            alert('Error: ' + result.error);
        }
    } catch (error) {
        console.error('Error generating quiz:', error);
        alert('Error generating quiz');
    }
}

function loadQuiz(quizId) {
    window.location.href = `/quiz/${quizId}/play`;
}

async function deleteQuiz(quizId, event) {
    event.stopPropagation(); // Prevent triggering loadQuiz
    
    if (!confirm('Are you sure you want to delete this quiz?')) {
        return;
    }
    
    try {
        const response = await fetch(`/quiz/${quizId}`, {
            method: 'DELETE',
            headers: {
                'X-User-Id': getUserId()
            }
        });
        
        if (response.ok) {
            // Reload quiz list
            htmx.trigger('#quiz-list', 'htmx:refresh');
        } else {
            const result = await response.json();
            alert('Error: ' + result.error);
        }
    } catch (error) {
        console.error('Error deleting quiz:', error);
        alert('Error deleting quiz');
    }
}

function viewAttemptAnalysis(attemptId) {
    window.location.href = `/quiz/attempt/${attemptId}`;
}
</script>
{% endblock %}
