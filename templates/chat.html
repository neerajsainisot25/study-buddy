{% extends "base.html" %}

{% block title %}Chat - {{ config.APP_NAME }}{% endblock %}

{% block head %}
<style>
    .message-user {
        @apply bg-blue-600 text-white rounded-lg px-4 py-2 mb-4 ml-auto max-w-3xl;
    }
    .message-assistant {
        @apply bg-gray-100 text-gray-900 rounded-lg px-4 py-2 mb-4 mr-auto max-w-3xl;
    }
    .sidebar-item {
        @apply px-4 py-2 hover:bg-gray-100 cursor-pointer rounded-lg transition-colors;
    }
    .sidebar-item.active {
        @apply bg-blue-50 text-blue-600 font-medium;
    }
</style>
{% endblock %}

{% block content %}
<div class="flex h-screen bg-gray-50">
    <!-- Sidebar -->
    <div class="w-64 bg-white border-r border-gray-200 flex flex-col">
        <div class="p-4 border-b border-gray-200">
            <button 
                hx-post="/chat/start"
                hx-target="#chat-sidebar"
                hx-swap="afterbegin"
                class="w-full bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                + New Chat
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-2" id="chat-sidebar" hx-get="/chat" hx-trigger="load, every 5s" hx-swap="innerHTML">
            <!-- Chats will be loaded here via HTMX -->
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="flex-1 flex flex-col">
        <!-- Chat Header -->
        <div class="bg-white border-b border-gray-200 px-6 py-4">
            <h1 class="text-xl font-semibold" id="chat-title">New Chat</h1>
        </div>

        <!-- Messages Container -->
        <div class="flex-1 overflow-y-auto p-6" id="messages-container">
            <div id="messages" class="space-y-4">
                <!-- Messages will be loaded here -->
            </div>
        </div>

        <!-- Input Area -->
        <div class="bg-white border-t border-gray-200 p-4">
            <form 
                id="chat-form"
                hx-post="/chat/{conversation_id}/message"
                hx-swap="none"
                hx-trigger="submit"
                onsubmit="return handleMessageSubmit(event)">
                <input type="hidden" name="conversation_id" id="conversation_id" value="" />
                <div class="flex gap-2">
                    <input
                        type="text"
                        name="message"
                        placeholder="Type your message..."
                        class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required
                        id="message-input" />
                    <button
                        type="submit"
                        class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors disabled:opacity-50">
                        Send
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
// Get user ID from localStorage
function getUserId() {
    return localStorage.getItem('userId') || '00000000-0000-0000-0000-000000000000';
}

// Set up HTMX configuration to add X-User-Id header
document.body.addEventListener('htmx:configRequest', function(event) {
    event.detail.headers['X-User-Id'] = getUserId();
});

// Handle SSE streaming for assistant messages
let currentAssistantMsg = null;

function appendStreamDelta(delta) {
    const messages = document.getElementById('messages');
    
    // Find or create assistant message element
    if (!currentAssistantMsg) {
        currentAssistantMsg = document.createElement('div');
        currentAssistantMsg.className = 'message-assistant';
        currentAssistantMsg.id = 'assistant-streaming';
        messages.appendChild(currentAssistantMsg);
    }
    
    currentAssistantMsg.textContent += delta;
    
    // Scroll to bottom
    const container = document.getElementById('messages-container');
    container.scrollTop = container.scrollHeight;
}

// Handle message form submission via HTMX (but intercept for streaming)
async function handleMessageSubmit(event) {
    event.preventDefault();
    
    const conversationId = document.getElementById('conversation_id').value;
    const messageInput = document.getElementById('message-input');
    const message = messageInput.value.trim();
    
    if (!message) return false;
    
    let chatId = conversationId;
    
    // Create new chat if needed
    if (!chatId) {
        chatId = await createChat();
        if (!chatId) return false;
    }
    
    // Add user message immediately
    const messages = document.getElementById('messages');
    const userMsg = document.createElement('div');
    userMsg.className = 'message-user';
    userMsg.textContent = message;
    messages.appendChild(userMsg);
    messageInput.value = '';
    
    // Reset assistant message
    currentAssistantMsg = null;
    
    // Send message via POST and handle SSE stream
    const response = await fetch(`/chat/${chatId}/message`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-User-Id': getUserId()
        },
        body: JSON.stringify({
            message: message,
            use_rag: true,
            use_web_search: false,
            use_research: false,
            use_thinking: false
        })
    });
    
    if (!response.ok) {
        console.error('Error sending message:', response.status);
        return false;
    }
    
    // Handle SSE stream
    await handleStreamingResponse(response);
    return false;
}

async function createChat() {
    try {
        const response = await fetch('/chat/start', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-User-Id': getUserId()
            },
            body: JSON.stringify({ title: 'New Conversation' })
        });
        const data = await response.json();
        const chatId = data.id;
        document.getElementById('conversation_id').value = chatId;
        document.getElementById('chat-title').textContent = data.title || 'New Chat';
        
        // Reload sidebar via HTMX
        htmx.trigger('#chat-sidebar', 'htmx:refresh');
        
        return chatId;
    } catch (error) {
        console.error('Error creating chat:', error);
        return null;
    }
}

async function handleStreamingResponse(response) {
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    
    while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        
        const chunk = decoder.decode(value, { stream: true });
        const lines = chunk.split('\n');
        
        for (const line of lines) {
            if (line.startsWith('data: ')) {
                const dataStr = line.slice(6).trim();
                if (dataStr === '[DONE]') {
                    currentAssistantMsg = null;
                    return;
                }
                if (dataStr) {
                    try {
                        const data = JSON.parse(dataStr);
                        if (data.delta) {
                            appendStreamDelta(data.delta);
                        }
                    } catch (e) {
                        // Skip invalid JSON
                    }
                }
            }
        }
    }
}

// Load chat when sidebar item is clicked
function loadChat(chatId) {
    document.getElementById('conversation_id').value = chatId;
    
    // Update active state
    document.querySelectorAll('.sidebar-item').forEach(item => {
        item.classList.remove('active');
        if (item.dataset.chatId === chatId) {
            item.classList.add('active');
            document.getElementById('chat-title').textContent = item.querySelector('.font-medium').textContent;
        }
    });
    
    // Load messages via HTMX
    htmx.ajax('GET', `/chat/${chatId}/messages`, {
        target: '#messages',
        swap: 'innerHTML',
        headers: { 'X-User-Id': getUserId() }
    });
    
    // Scroll to bottom
    setTimeout(() => {
        const container = document.getElementById('messages-container');
        container.scrollTop = container.scrollHeight;
    }, 100);
}
</script>
{% endblock %}
