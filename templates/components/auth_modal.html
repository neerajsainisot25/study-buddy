<!-- Authentication Modal -->
<div id="authModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeAuthModal()">&times;</span>
        
        <!-- Login Form -->
        <div id="loginForm" class="auth-form">
            <h2>Welcome Back!</h2>
            <p style="color: var(--text-secondary); margin-bottom: 24px;">Sign in to continue your learning journey</p>
            
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required placeholder="your@email.com">
                </div>
                
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required placeholder="Enter your password">
                </div>
                
                <div id="loginError" class="error-message"></div>
                
                <button type="submit" class="btn-primary full-width">Sign In</button>
                
                <p class="auth-switch">
                    Don't have an account? 
                    <a href="#" onclick="switchToSignup(); return false;">Sign up</a>
                </p>
            </form>
        </div>
        
        <!-- Signup Form -->
        <div id="signupForm" class="auth-form" style="display: none;">
            <h2>Create Account</h2>
            <p style="color: var(--text-secondary); margin-bottom: 24px;">Start your academic journey with StudyMate</p>
            
            <form onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" placeholder="John Doe">
                </div>
                
                <div class="form-group">
                    <label for="signupEmail">Email</label>
                    <input type="email" id="signupEmail" required placeholder="your@email.com">
                </div>
                
                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" required placeholder="At least 6 characters" minlength="6">
                </div>
                
                <div class="form-group">
                    <label for="signupPasswordConfirm">Confirm Password</label>
                    <input type="password" id="signupPasswordConfirm" required placeholder="Re-enter password">
                </div>
                
                <div id="signupError" class="error-message"></div>
                
                <button type="submit" class="btn-primary full-width">Create Account</button>
                
                <p class="auth-switch">
                    Already have an account? 
                    <a href="#" onclick="switchToLogin(); return false;">Sign in</a>
                </p>
            </form>
        </div>
    </div>
</div>

<style>
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
}

.modal-content {
    background-color: var(--bg-primary);
    margin: 5% auto;
    padding: 32px;
    border: 2px solid var(--border);
    border-radius: 16px;
    width: 90%;
    max-width: 450px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    animation: slideDown 0.3s ease-out;
}

@keyframes slideDown {
    from {
        opacity: 0;
        transform: translateY(-30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.close {
    color: var(--text-secondary);
    float: right;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
    line-height: 1;
    transition: color 0.3s;
}

.close:hover {
    color: var(--primary);
}

.auth-form h2 {
    color: var(--primary);
    margin-bottom: 8px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    color: var(--text-primary);
    font-weight: 500;
}

.form-group input {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid var(--border);
    border-radius: 8px;
    font-size: 16px;
    background: var(--bg-secondary);
    color: var(--text-primary);
    transition: border-color 0.3s, box-shadow 0.3s;
}

.form-group input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(0, 121, 107, 0.1);
}

.full-width {
    width: 100%;
    margin-top: 8px;
}

.auth-switch {
    text-align: center;
    margin-top: 24px;
    color: var(--text-secondary);
}

.auth-switch a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 600;
}

.auth-switch a:hover {
    text-decoration: underline;
}

.error-message {
    color: #ff6b6b;
    background: rgba(255, 107, 107, 0.1);
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    display: none;
}

.error-message.show {
    display: block;
}
</style>
