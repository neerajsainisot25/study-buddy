<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMate - Your Academic Companion</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#0D9488',
                            50: '#F0FDFA',
                            100: '#CCFBF1',
                            500: '#14B8A6',
                            600: '#0D9488',
                            700: '#0F766E',
                        },
                        secondary: {
                            DEFAULT: '#6366F1',
                            light: '#818CF8',
                            dark: '#4F46E5',
                        },
                        accent: {
                            DEFAULT: '#F59E0B',
                            light: '#FDE68A',
                            dark: '#D97706',
                        },
                        success: '#10B981',
                        warning: '#F59E0B',
                        danger: '#EF4444',
                    },
                    boxShadow: {
                        'colored': '0 10px 30px -10px rgba(13, 148, 136, 0.3)',
                    },
                    borderRadius: {
                        'xl': '16px',
                        '2xl': '24px',
                        '3xl': '32px',
                    }
                }
            }
        }
    </script>
    
    <!-- Base Styles -->
    <link rel="stylesheet" href="/static/css/nature-theme.css">
    <link rel="stylesheet" href="/static/css/logo-geometric.css">
    <link rel="stylesheet" href="/static/css/layout-fixes.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/enhancements.css">
    <!-- Modern Design System - Loads LAST to override -->
    <link rel="stylesheet" href="/static/css/modern-design-system.css">
    <link rel="stylesheet" href="/static/css/bold-enhancements.css">
    <link rel="stylesheet" href="/static/css/theme-override.css">
</head>
<body style="background-color: var(--bg);">
    <!-- Sidebar Component -->
    <div id="sidebarContainer"></div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="content-wrapper">
            <!-- Dashboard Page -->
            <div id="dashboardContainer"></div>

            <!-- Chat Page -->
            <div id="chatPage" class="page-content">
                <div class="section-card">
                    <div class="chat-controls">
                        <div class="chat-controls-row">
                            <label style="font-weight: 500; color: var(--text); font-size: 13px;">Capabilities:</label>
                            <div class="capability-toggles">
                                <label class="capability-toggle active" id="toggleRAG">
                                    <input type="checkbox" checked data-capability="rag">
                                    <span>RAG</span>
                                </label>
                                <label class="capability-toggle" id="toggleWebSearch">
                                    <input type="checkbox" data-capability="web_search">
                                    <span>Web Search</span>
                                </label>
                                <label class="capability-toggle" id="toggleResearch">
                                    <input type="checkbox" data-capability="research">
                                    <span>Research</span>
                                </label>
                                <label class="capability-toggle" id="toggleThinking">
                                    <input type="checkbox" data-capability="thinking">
                                    <span>Thinking</span>
                                </label>
                            </div>
                            <button class="btn btn-secondary btn-small" id="addFilesButton">Add Files</button>
                        </div>
                        <div class="chat-controls-row">
                            <span id="modeDescription" style="font-size: 12px; color: var(--text-secondary);">
                                RAG mode enabled. Add files to enhance responses.
                            </span>
                        </div>
                    </div>
                </div>

                <div class="section-card">
                    <div class="chat-container">
                        <div class="chat-messages" id="chatMessages">
                            <div class="message bot">
                                <div class="message-content">
                                    Hello! I'm your AI assistant. How can I help you today?
                                </div>
                            </div>
                        </div>
                        <div class="chat-input-area">
                            <input type="text" class="chat-input" id="chatInput" placeholder="Type your message..." />
                            <button class="btn btn-primary" id="sendButton">Send</button>
                            <button class="btn btn-secondary" id="clearButton">Clear</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Quiz Page -->
            <div id="quizContainer"></div>

            <!-- Calendar Page -->
            <div id="calendarContainer"></div>

            <!-- Analytics Page -->
            <div id="analyticsContainer"></div>

            <!-- Profile Page -->
            <div id="profileContainer"></div>
        </div>
    </div>

    <!-- Modals Container -->
    <div id="modalsContainer"></div>
    
    <!-- Core Scripts -->
    <script src="/static/js/notifications.js"></script>
    <script src="/static/js/navigation.js"></script>
    <script src="/static/js/dashboard.js"></script>
    <script src="/static/js/fileManager.js"></script>
    <script src="/static/js/componentLoader.js"></script>
    
    <!-- Feature Scripts -->
    <script src="/static/js/chat.js"></script>
    <script src="/static/js/quiz.js"></script>
    <script src="/static/js/calendar.js"></script>
    <script src="/static/js/analytics.js"></script>
    <script src="/static/js/profile.js"></script>
    
    <!-- Initialize -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Load components
            await ComponentLoader.loadAll();
            
            // Initialize modules
            if (window.fileManagerInstance) {
                window.fileManagerInstance.init();
            }
            
            if (window.dashboardInstance) {
                await window.dashboardInstance.init();
            }

            if (typeof Chat !== 'undefined') {
                window.chatInstance = new Chat();
                window.chatInstance.init();
            }

            if (typeof Quiz !== 'undefined') {
                window.quizInstance = new Quiz();
                window.quizInstance.init();
            }

            if (typeof Calendar !== 'undefined') {
                window.calendarInstance = new Calendar();
                window.calendarInstance.init();
            }

            if (typeof Analytics !== 'undefined') {
                window.analyticsInstance = new Analytics();
            }

            if (typeof Profile !== 'undefined' && window.profileInstance) {
                window.profileInstance.init();
            }
        });
    </script>
</body>
</html>
